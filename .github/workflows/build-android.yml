name: Build Native Android APK & AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''


      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          DIR="android-native"
          if [ ! -f "$DIR/settings.gradle.kts" ]; then
            echo "File $DIR/settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME belum diatur."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$DIR/local.properties"

          if [ ! -f "$DIR/app/ci-debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$DIR/app/ci-debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -f "public/exambro.html" ]; then
            mkdir -p "$DIR/app/src/main/assets/web/icons"
            cp public/exambro.html "$DIR/app/src/main/assets/web/index.html"

            if [ -f "public/manifest.json" ]; then
              cp public/manifest.json "$DIR/app/src/main/assets/web/"
            fi

            if [ -f "public/sw.js" ]; then
              cp public/sw.js "$DIR/app/src/main/assets/web/"
            fi

            if [ -d "public/icons" ]; then
              cp -r public/icons/. "$DIR/app/src/main/assets/web/icons/"
            fi
          fi

      - name: Configure release signing from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          DIR="android-native"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode \
              > "$DIR/app/release-keystore.jks"

            printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" \
              "$KEY_ALIAS" \
              "$KEY_PASSWORD" \
              > "$DIR/keystore.properties"
          else
            echo "KEYSTORE_BASE64 tidak diatur; build release akan memakai konfigurasi tanpa keystore khusus."
          fi

      - name: Build APK and AAB
        working-directory: android-native
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts

          cp android-native/app/build/outputs/apk/debug/*.apk build-artifacts/
          cp android-native/app/build/outputs/apk/release/*.apk build-artifacts/
          cp android-native/app/build/outputs/bundle/release/*.aab build-artifacts/

          ls -lh build-artifacts/

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: prida-exambro-android-builds
          path: build-artifacts/*
